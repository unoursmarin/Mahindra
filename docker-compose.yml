services:
  postgres:
    image: postgres:16-alpine
    container_name: mahindra-postgres
    environment:
      POSTGRES_DB: mahindrageodb
      POSTGRES_USER: mahindra
      POSTGRES_PASSWORD: mahindra
    ports:
      - "5432:5432"
    volumes:
      - mahindra-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mahindra -d mahindrageodb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mahindra-pg-data:
